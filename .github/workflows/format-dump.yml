# Temporary: formats with the CI image's tools and prints the diff. Removed before merge.
name: Format dump
on:
  push:
    branches: [claude/project-thread-0hnhww-format]
jobs:
  dump:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fierracodes/shell-arch-env:latest
    steps:
      - uses: actions/checkout@v7
      - shell: fish {0}
        run: |
          git config --global --add safe.directory $PWD
          for file in (string match -v 'build/*' **.qml)
            /usr/lib/qt6/bin/qmlformat -i $file
          end
          find plugin extras -name '*.cpp' -o -name '*.hpp' | xargs clang-format -i
          git diff --stat | tail -1
          echo "BEGIN-PATCH"
          git diff | gzip -9 | base64 -w 76
          echo "END-PATCH"
